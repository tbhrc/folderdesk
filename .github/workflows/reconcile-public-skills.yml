name: Reconcile ARC Parity

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: [self-hosted, Linux, tbhrc, arc]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Checkout canonical Workspace Skills
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.SUPER_ADMIN_MANAGER_TBHRC }}
        run: |
          set -euo pipefail
          workspace_dir="$RUNNER_TEMP/tbhrc-workspace"
          rm -rf "$workspace_dir"
          gh repo clone tbhrc/workspace "$workspace_dir" -- --quiet
          test -d "$workspace_dir/.folderdesk/skills"

      - name: Sync explicitly approved public Skills
        shell: bash
        run: python3 scripts/sync_public_skills.py --source "$RUNNER_TEMP/tbhrc-workspace/.folderdesk/skills" --apply

      - name: Commit deterministic public-Skill parity update
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- .github/skills; then
            echo "Public ARC Skills already in parity."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/skills
            git commit -m "Sync approved public ARC Skills"
            git push origin HEAD:main
          fi

      - name: Reconcile TBHRC reference and Fast Links
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/arc-parity.json"
          python3 scripts/reconcile_tbhrc_reference.py \
            --skills-source "$RUNNER_TEMP/tbhrc-workspace/.folderdesk/skills" \
            --report "$report"
          {
            echo '### ARC parity report'
            echo '```json'
            cat "$report"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
